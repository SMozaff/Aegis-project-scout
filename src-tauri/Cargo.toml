[package]
name = "raven-api-hunter"
version = "0.1.0"
description = "Raven API Hunter desktop security-hygiene scanner for public GitHub repositories"
authors = ["Raven API Hunter Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "raven_api_hunter_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
keyring = "3"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
regex = "1"
tokio = { version = "1", features = ["net", "time", "sync"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
csv = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "warn"
