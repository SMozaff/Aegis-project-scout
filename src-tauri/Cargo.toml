[package]
name = "raven-api-hunter"
default-run = "raven-api-hunter"
version = "0.1.0"
description = "Raven API Hunter desktop security-hygiene scanner for public GitHub repositories"
authors = ["Raven API Hunter Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "raven_api_hunter_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "raven-hunter"
path = "src/bin/raven-hunter.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
keyring = "3"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
octocrab = { version = "0.41", default-features = false, features = ["rustls"] }
regex = "1"
tokio = { version = "1", features = ["macros", "net", "time", "sync"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
csv = "1"
url = "2"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]