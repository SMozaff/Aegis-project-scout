name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl wget file libxdo-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Frontend type-check + build
        run: npm run build

      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: Rust test
        working-directory: src-tauri
        run: cargo test --all

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64
          - platform: macos-14
            target: aarch64-apple-darwin
            artifact_name: macos-arm64
          - platform: macos-14
            target: x86_64-apple-darwin
            artifact_name: macos-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl wget file libxdo-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install npm deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }}

      - name: Bundle Tauri app (Linux/macOS)
        if: matrix.platform != 'windows-latest'
        working-directory: src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --target ${{ matrix.target }} --no-bundle || true

      - name: Bundle Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --target ${{ matrix.target }}

      - name: Prepare artifact staging (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p staging
          cp src-tauri/target/${{ matrix.target }}/release/aegis-project-scout staging/ 2>/dev/null || \
            cp src-tauri/target/release/aegis-project-scout staging/ 2>/dev/null || true
          cp -r src-tauri/target/${{ matrix.target }}/release/bundle/* staging/ 2>/dev/null || \
            cp -r src-tauri/target/release/bundle/* staging/ 2>/dev/null || true

      - name: Prepare artifact staging (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item src-tauri/target/${{ matrix.target }}/release/aegis-project-scout.exe staging/ -ErrorAction SilentlyContinue
          if (Test-Path src-tauri/target/${{ matrix.target }}/release/bundle) {
            Copy-Item -Recurse src-tauri/target/${{ matrix.target }}/release/bundle/* staging/
          }

      - name: Prepare artifact staging (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p staging
          cp src-tauri/target/${{ matrix.target }}/release/aegis-project-scout staging/ 2>/dev/null || true
          if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
            cp -r src-tauri/target/${{ matrix.target }}/release/bundle/* staging/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-project-scout-${{ matrix.artifact_name }}
          path: staging/
          retention-days: 14
          if-no-files-found: warn
